:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --bg-color: #f8fafc;
  --surface-color: #ffffff;
  --border-color: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --error: #ef4444;
  --success: #22c55e;
  --focus-ring: rgba(37, 99, 235, 0.3);

  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);

  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-serif: 'Times New Roman', Times, serif;
}

.dark {
  --bg-color: #020617;
  --surface-color: #0f172a;
  --border-color: #1e293b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --right-panel-bg: linear-gradient(135deg, #020617, #0f172a);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-color);
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button,
a {
  transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}

button:hover,
a:hover {
  transform: translateY(-1px);
}

/* Application Layout */
.app-container {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.left-panel {
  flex: 1;
  max-width: 650px;
  background: var(--surface-color);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-md);
  z-index: 10;
  color: var(--text-main);
}

.dark .left-panel {
  background-color: #0f172a;
  border-right-color: #334155;
  color: #f8fafc;
}

.right-panel {
  flex: 1;
  background: var(--right-panel-bg, linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%));
  padding: 2rem;
  overflow-y: auto;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}

.dark ::-webkit-scrollbar-thumb {
  background: #475569;
}

.dark ::-webkit-scrollbar-thumb:hover {
  background: #64748b;
}

/* Shared UI Components */
.input-group {
  margin-bottom: 1.25rem;
}

.input-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-main);
  margin-bottom: 0.5rem;
}

.dark .input-label {
  color: #f8fafc;
}

.input-count-limit {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.input-count-limit.limit-reached {
  color: var(--error);
  font-weight: bold;
}

.input-field {
  width: 100%;
  padding: 0.625rem 0.875rem;
  border: 1px solid var(--border-color);
  border-radius: 0.5rem;
  font-size: 0.875rem;
  transition: all 0.2s;
  background-color: #f8fafc;
  font-family: var(--font-sans);
  color: var(--text-main);
}

.input-field::-moz-placeholder {
  color: var(--text-muted);
  opacity: 0.7;
}

.input-field::placeholder {
  color: var(--text-muted);
  opacity: 0.7;
}

.input-field:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--focus-ring);
  background-color: var(--surface-color);
  color: var(--text-main);
}

.dark .input-field {
  background-color: #1e293b;
  border-color: #334155;
  color: #f8fafc;
}

.dark .input-field:focus {
  background-color: #0f172a;
  border-color: #60a5fa;
  color: #f8fafc;
}

.dark .input-field::-moz-placeholder {
  color: #94a3b8;
}

.dark .input-field::placeholder {
  color: #94a3b8;
}

textarea.input-field {
  resize: vertical;
  min-height: 80px;
}

.dark textarea.input-field {
  background-color: #1e293b;
  border-color: #334155;
  color: #f8fafc;
}

.dark textarea.input-field:focus {
  background-color: #0f172a;
  border-color: #60a5fa;
  color: #f8fafc;
}

.input-field.error {
  border-color: var(--error);
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
}

.error-msg {
  color: var(--error);
  font-size: 0.75rem;
  margin-top: 0.375rem;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  border-radius: 0.5rem;
  font-weight: 500;
  font-size: 0.875rem;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}

.btn-primary {
  background-color: var(--primary);
  color: white;
}

.btn-primary:disabled {
  background-color: #93c5fd;
  cursor: not-allowed;
}

.btn-primary:hover:not(:disabled) {
  background-color: var(--primary-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.btn-outline {
  background-color: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-main);
}

.btn-outline:hover {
  background-color: var(--bg-color);
  border-color: #cbd5e1;
}

.dark .btn-outline {
  border-color: #475569;
  color: #f8fafc;
}

.dark .btn-outline:hover {
  background-color: #1e293b;
  border-color: #64748b;
}

.btn-danger {
  background-color: transparent;
  color: var(--error);
}

.btn-danger:hover {
  background-color: #fef2f2;
}

.dark .btn-danger {
  color: #f87171;
}

.dark .btn-danger:hover {
  background-color: #7f1d1d;
}

/* Header */
.app-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  flex-shrink: 0;
  color: var(--text-main);
}

.dark .app-header {
  background-color: #0f172a;
  border-bottom-color: #334155;
  color: #f8fafc;
}

.app-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.dark .app-title {
  color: #f8fafc;
}

/* Form Area */
.form-area {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  background: var(--surface-color);
}

.dark .form-area {
  background: linear-gradient(180deg, #0f172a 0%, #1a202c 100%);
  background-attachment: fixed;
}

/* Section Header (Accordion-like) */
.section-header {
  padding: 1rem 1.25rem;
  background: white;
  border: 1px solid var(--border-color);
  border-radius: 0.5rem;
  margin-bottom: 0.5rem;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  transition: all 0.2s;
  color: var(--text-main);
}

.section-header.active {
  background-color: var(--bg-color);
  border-bottom-color: transparent;
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
  margin-bottom: 0;
}

.section-header:hover {
  border-color: #cbd5e1;
}

.dark .section-header {
  background-color: #0f172a;
  border-color: #334155;
  color: #f8fafc;
}

.dark .section-header.active {
  background-color: #1e293b;
  border-color: #475569;
}

.dark .section-header:hover {
  border-color: #475569;
}

.section-body {
  padding: 1.5rem;
  border: 1px solid var(--border-color);
  border-top: none;
  border-bottom-left-radius: 0.5rem;
  border-bottom-right-radius: 0.5rem;
  margin-bottom: 1rem;
  background: white;
  color: var(--text-main);
}

.dark .section-body {
  background-color: #0f172a;
  border-color: #334155;
  color: #f8fafc;
}

/* Item List Arrays */
.array-item {
  border: 1px solid var(--border-color);
  padding: 1rem;
  border-radius: 0.5rem;
  margin-bottom: 1rem;
  background: #f8fafc;
  position: relative;
  color: var(--text-main);
}

.array-item-title {
  font-weight: 600;
  margin-bottom: 0.75rem;
  display: flex;
  justify-content: space-between;
  color: var(--text-main);
}

.dark .array-item {
  border-color: #334155;
  background-color: #1e293b;
  color: #f8fafc;
}

.dark .array-item-title {
  color: #f8fafc;
}

.input-row {
  display: flex;
  gap: 1rem;
}

.input-row>.input-group {
  flex: 1;
}

/* A4 Print Preview Strict Styling */
.a4-container {
  /* Fixed pixel A4 to ensure export parity with preview */
  width: 794px; /* A4 width in px at 96dpi */
  min-height: 1123px; /* A4 height in px at 96dpi */
  background: white;
  box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  position: relative;
  overflow: hidden;
}

/* The actual printable area */
.resume-paper {
  padding: 10mm 15mm;
  width: 100%;
  height: 100%;
  font-family: var(--font-serif);
  color: black;
  font-size: 11pt;
  /* Strict font size, 11pt is optimal for reading */
  line-height: 1.4;
  box-sizing: border-box;
}

.resume-header {
  text-align: center;
  margin-bottom: 4mm;
}

.resume-name {
  font-family: 'Times New Roman', serif;
  font-size: 24pt;
  font-weight: 700;
  margin-bottom: 2mm;
  text-transform: uppercase;
  color: #0b2239;
  /* Slight premium dark blue for name to match user's image styling */
}

.resume-contact {
  font-size: 11pt;
  margin-bottom: 2px;
  display: flex;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}

.resume-contact a {
  color: black;
  text-decoration: none;
}

.resume-divider {
  border: 0;
  border-top: 1px solid #777;
  /* Standard thin line */
  margin: 3mm 0;
}

.resume-section {
  margin-bottom: 3mm;
}

.resume-section-title {
  font-size: 12pt;
  font-weight: bold;
  text-transform: uppercase;
  border-bottom: 1px solid black;
  margin-bottom: 2mm;
  padding-bottom: 1px;
  color: #000;
}

.resume-item {
  margin-bottom: 2mm;
}

.resume-summary {
  text-align: justify;
  margin-bottom: 3mm;
}

.resume-item-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 2px;
}

.resume-item-title {
  font-weight: bold;
  font-size: 11pt;
}

.resume-item-subtitle {
  font-style: italic;
  font-size: 11pt;
}

.resume-item-date {
  font-size: 11pt;
  white-space: nowrap;
}

.resume-list {
  padding-left: 6mm;
  margin-top: 2px;
  list-style-type: disc;
}

.resume-list li {
  margin-bottom: 2px;
  text-align: left;
  font-size: 10.5pt;
  /* Use flex to keep bullet aligned with baseline and preserve wrapping */
  display: flex;
  align-items: flex-start;
  gap: 6px;
  white-space: normal;
}

/* Remove default markers so we control bullets explicitly */
.resume-list {
  list-style: none;
  padding-left: 0;
}

/* Use a hollow bullet rendered via pseudo-element for consistent alignment */
.resume-list li::before {
  content: '◦';
  display: inline-block;
  width: 1em;
  margin-right: 6px;
  line-height: 1;
}

/* Prevent any transformations or layout shifts during export */
.export-lock, .export-lock * {
  transform: none !important;
  box-shadow: none !important;
  transition: none !important;
}

.resume-skills-group {
  margin-bottom: 2px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 8px;
}

.resume-skill-label {
  font-weight: bold;
}

/* AI Feedback Panel */
.ai-panel {
  background: #fdf2f8;
  border: 1px solid #fbcfe8;
  border-radius: 0.5rem;
  padding: 1rem;
  margin-bottom: 1rem;
}

.ai-panel-title {
  color: #be185d;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
}

.ai-suggestion {
  background: white;
  border: 1px solid #fbcfe8;
  padding: 0.75rem;
  border-radius: 0.375rem;
  margin-bottom: 0.5rem;
  font-size: 0.875rem;
}

.ai-suggestion:last-child {
  margin-bottom: 0;
}

.ai-verb {
  font-weight: 600;
  color: #e11d48;
}

.ai-suggestion-replace {
  color: #16a34a;
  font-weight: 600;
}
